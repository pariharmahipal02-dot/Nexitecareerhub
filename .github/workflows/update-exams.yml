name: Auto Update Exam Data

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-exams:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update exam data
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python <<'PY'
          import os
          import json
          import urllib.request
          from datetime import date

          api_key = os.environ["GEMINI_API_KEY"]
          today = date.today().isoformat()

          prompt = f"""
          Today is {today}.

          Generate a current India government and competitive exam
          reference database for a student career website.

          Return ONLY valid JSON.
          Do not use markdown.
          Do not use code fences.

          Return a JSON array of exam objects.

          Every object MUST contain exactly these fields:

          id
          name
          org
          cat
          edu
          min
          max
          status
          desc

          cat must be one of:
          Government
          Defence
          Railway
          Banking
          Civil Services
          Teaching
          Police

          edu must be one of:
          10th
          12th
          Graduation
          Post Graduation

          Include important exams from:
          SSC
          Railway
          Defence
          Banking
          UPSC
          Teaching
          Police
          and other major Indian competitive examinations.

          Use reasonable minimum and maximum age requirements
          for eligibility reference.

          Do not invent notification dates.

          Use "Reference" as the status.

          Return at least 15 useful exams.

          This is an eligibility reference database.
          Users should verify the latest official notification
          before applying.
          """

          url = (
              "https://generativelanguage.googleapis.com/v1beta/models/"
              "gemini-2.5-flash:generateContent"
          )

          payload = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "temperature": 0.2,
                  "responseMimeType": "application/json"
              }
          }

          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": api_key
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(req) as response:
                  result = json.loads(
                      response.read().decode("utf-8")
                  )
          except Exception as e:
              print("Gemini API request failed:")
              print(e)
              raise

          text = (
              result["candidates"][0]
              ["content"]["parts"][0]["text"]
              .strip()
          )

          exams = json.loads(text)

          if not isinstance(exams, list):
              raise Exception("Invalid exam data received")

          if len(exams) < 5:
              raise Exception("Too few exams received")

          required = [
              "id",
              "name",
              "org",
              "cat",
              "edu",
              "min",
              "max",
              "status",
              "desc"
          ]

          for exam in exams:
              if not isinstance(exam, dict):
                  raise Exception("Invalid exam object")

              for field in required:
                  if field not in exam:
                      raise Exception(
                          f"Missing field: {field}"
                      )

          with open(
              "exam-data.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  exams,
                  f,
                  ensure

<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexite Career Lab | Pro Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .modal-animate { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="bg-slate-50">

    <!-- Navbar -->
    <nav class="sticky top-0 bg-white/80 backdrop-blur-md shadow-sm z-50 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <img src="11318.png" class="h-10 w-10 object-contain">
            <span class="font-black text-xl tracking-tighter">NEXITE <span class="text-blue-600">LAB</span></span>
        </div>
        <div class="space-x-6 font-semibold hidden md:flex">
            <a href="#home" class="hover:text-blue-600">Home</a>
            <a href="#tools" class="hover:text-blue-600">Tools</a>
            <a href="#gallery" class="hover:text-blue-600">Gallery</a>
            <button onclick="toggleModal(true)" class="bg-blue-600 text-white px-5 py-2 rounded-full hover:bg-blue-700">Login</button>
        </div>
    </nav>

    <!-- Login Popup -->
    <div id="loginModal" class="hidden fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 w-full max-w-sm modal-animate shadow-2xl relative">
            <button onclick="toggleModal(false)" class="absolute top-4 right-4 text-gray-400 hover:text-black"><i class="fa-solid fa-xmark text-xl"></i></button>
            <h2 class="text-2xl font-bold mb-6">Welcome Back</h2>
            <input type="email" id="email" placeholder="Email" class="w-full p-3 border rounded-xl mb-3">
            <input type="password" id="pass" placeholder="Password" class="w-full p-3 border rounded-xl mb-4">
            <button onclick="loginWithEmail()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold mb-4">Login</button>
            <div class="text-center text-gray-400 text-sm mb-4">OR</div>
            <button onclick="googleLogin()" class="w-full border border-gray-300 py-3 rounded-xl font-bold flex justify-center items-center gap-2">
                <img src="https://www.google.com/favicon.ico" class="w-4 h-4"> Sign in with Google
            </button>
        </div>
    </div>

    <!-- Hero -->
    <section id="home" class="py-20 text-center px-4">
        <img src="11287.jpg" class="w-32 h-32 rounded-full mx-auto shadow-2xl mb-6 border-4 border-white">
        <h1 class="text-5xl font-extrabold mb-4">Nexite Career Lab</h1>
        <p class="text-gray-600 max-w-md mx-auto">Smart tools for smart students. Built by Mahipal Parihar.</p>
    </section>

    <!-- Tools -->
    <section id="tools" class="py-16 bg-white px-4">
        <div class="max-w-4xl mx-auto">
            <h2 class="text-3xl font-bold mb-8 text-center">Eligibility Tools</h2>
            <div class="grid md:grid-cols-2 gap-6">
                <!-- Age Calc -->
                <div class="p-6 border rounded-3xl shadow-sm bg-blue-50">
                    <h3 class="font-bold text-xl mb-4">Age Calculator</h3>
                    <input type="date" id="dob" class="w-full p-3 rounded-xl mb-3">
                    <button onclick="calcAge()" class="w-full bg-blue-600 text-white py-3 rounded-xl">Calculate Now</button>
                    <p id="ageResult" class="mt-4 font-bold text-blue-800 text-center"></p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="text-center py-10 bg-gray-900 text-white">
        <p class="font-bold">Made with ❤️ by Nexite</p>
    </footer>

    <!-- Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // FIREBASE CONFIG (Paste here from Screenshot)
        const firebaseConfig = {
            apiKey: "AIzaSyA2y6Ty0Iq2jFjbeGKaqqUMyLW0NZwKLIA",
            authDomain: "nexite-career-lab.firebaseapp.com",
            projectId: "nexite-career-lab",
            storageBucket: "nexite-career-lab.firebasestorage.app",
            messagingSenderId: "341950730543",
            appId: "1:341950730543:web:88d3b101af0351b53cd1da"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        window.toggleModal = (show) => document.getElementById('loginModal').classList.toggle('hidden', !show);
        
        window.loginWithEmail = async () => {
            const e = document.getElementById('email').value;
            const p = document.getElementById('pass').value;
            try { await signInWithEmailAndPassword(auth, e, p); alert("Logged in!"); toggleModal(false); } 
            catch(err) { alert(err.message); }
        };

        window.googleLogin = async () => {
            try { await signInWithPopup(auth, provider); alert("Logged in!"); toggleModal(false); }
            catch(err) { alert(err.message); }
        };

        window.calcAge = () => {
            const dob = new Date(document.getElementById('dob').value);
            const now = new Date();
            let y = now.getFullYear() - dob.getFullYear();
            let m = now.getMonth() - dob.getMonth();
            let d = now.getDate() - dob.getDate();
            if(d < 0) { m--; d += 30; }
            if(m < 0) { y--; m += 12; }
            document.getElementById('ageResult').innerText = `${y} Years, ${m} Months, ${d} Days`;
        }
    </script>
</body>
</html>
